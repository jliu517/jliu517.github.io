<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jon Liu - Photography</title>
<style>
  @font-face {
    font-family: "Cheltenham Condensed";
    src: url("fonts/Cheltenham Condensed Bold Italic.ttf") format("truetype");
    font-weight: 700;
    font-style: italic;
    font-display: swap;
  }

  :root {
    --ink: #111111;
    --paper: #ffffff;
    --line: #dcdcdc;
    --muted: #8a8a8a;
    --gap: 12px;
  }

  * { box-sizing: border-box; }

  html {
    background: var(--ink);
  }

  body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */

  header {
    background: var(--ink);
    padding: 30px 40px 20px 40px;
  }

  .header-inner {
    max-width: 1800px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .header-left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }

  .header-right {
    font-family: "Cheltenham Condensed", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-style: italic;
    color: var(--paper);
    text-align: right;
    font-size: 15px;
    line-height: 1.35;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    white-space: nowrap;
    align-self: flex-end;
    margin-bottom: 14px;
  }

  h1.name {
    font-family: "Cheltenham Condensed", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-style: italic;
    text-transform: uppercase;
    color: var(--paper);
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 0;
  }

  .tagline {
    font-family: "Cheltenham Condensed", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-style: italic;
    font-size: 14px;
    color: #aaaaaa;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1;
    margin: 2px 0 0 0;
  }

  /* ---------- Tabs ---------- */

  nav.tabs {
    display: flex;
    justify-content: center;
    gap: 32px;
    position: relative;
  }

  nav.tabs button {
    appearance: none;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #999999;
    padding: 0 0 8px 0;
    cursor: pointer;
    transition: color 0.2s ease;
  }

  nav.tabs button:hover {
    color: var(--paper);
  }

  nav.tabs button.active {
    color: var(--paper);
  }

  .tab-indicator {
    position: absolute;
    bottom: 0;
    height: 2px;
    background: var(--paper);
    transition: left 0.3s cubic-bezier(0.65, 0, 0.35, 1), width 0.3s cubic-bezier(0.65, 0, 0.35, 1);
  }

  /* ---------- Main / Views ---------- */

  main {
    max-width: 1800px;
    margin: 0 auto;
    padding: 40px 40px 100px 40px;
  }

  .view { display: none; }
  .view.active { display: block; animation: fade 0.4s ease; }

  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Portfolio: masonry via CSS columns ---------- */

  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 1px;
    column-gap: var(--gap);
    row-gap: 0;
  }

  .gallery figure {
    margin: 0;
    overflow: hidden;
  }

  .gallery img {
    display: block;
    width: 100%;
    height: auto;
    transition: transform 0.5s ease, filter 0.5s ease;
  }

  .gallery figure:hover img {
    transform: scale(1.015);
  }

  @media (max-width: 900px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 560px) {
    .gallery { grid-template-columns: 1fr; }
    header { padding-top: 24px; padding-bottom: 24px; }

    .header-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "left tabs"
        "left right";
      align-items: center;
      row-gap: 10px;
      column-gap: 12px;
    }

    .header-left {
      grid-area: left;
      text-align: left;
      align-items: flex-start;
    }

    nav.tabs {
      grid-area: tabs;
      justify-content: flex-end;
      gap: 16px;
    }

    .header-right {
      grid-area: right;
      align-self: start;
      text-align: right;
      margin-bottom: 0;
      white-space: normal;
    }

    h1.name {
      font-size: 24px;
    }

    .tagline {
      font-size: 11px;
    }

    nav.tabs button {
      font-size: 12px;
    }

    .header-right {
      font-size: 11px;
    }

    footer {
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      padding-bottom: 32px;
    }

    .footer-signoff {
      font-size: 22px;
    }
  }

  /* ---------- About ---------- */

  .about {
    max-width: 640px;
  }

  .about p {
    font-size: 17px;
    line-height: 1.7;
    color: #333;
    margin: 0 0 20px 0;
  }

  .about h2 {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin: 40px 0 12px 0;
  }

  .about ul {
    list-style: none;
    padding: 0;
    margin: 0;
    font-size: 15px;
    color: #333;
    line-height: 1.9;
  }

  .about a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }

  .about a:hover {
    border-bottom-color: var(--ink);
  }

  /* ---------- Footer ---------- */

  footer {
    max-width: 1800px;
    margin: 0 auto;
    padding: 0 40px 48px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .footer-signoff {
    font-family: "Cheltenham Condensed", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-style: italic;
    font-weight: 700;
    color: var(--ink);
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: -0.03em;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-left">
      <h1 class="name">Jon Liu</h1>
      <p class="tagline">Photography</p>
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="portfolio">Portfolio</button>
      <button class="tab-btn" data-tab="about">About</button>
      <span class="tab-indicator" id="tab-indicator"></span>
    </nav>

    <div class="header-right">ARE YOU LIVING IN THE<br>REAL WORLD?</div>
  </div>
</header>

<main>

  <!-- PORTFOLIO -->
  <section class="view active" id="portfolio">
    <div class="gallery">
      <figure><img src="portfolio 1.jpg" alt="Portfolio image 1" loading="lazy"></figure>
      <figure><img src="portfolio 2.jpg" alt="Portfolio image 2" loading="lazy"></figure>
      <figure><img src="portfolio 3.jpg" alt="Portfolio image 3" loading="lazy"></figure>
      <figure><img src="portfolio 4.jpg" alt="Portfolio image 4" loading="lazy"></figure>
      <figure><img src="portfolio 5.jpg" alt="Portfolio image 5" loading="lazy"></figure>
      <figure><img src="portfolio 6.jpg" alt="Portfolio image 6" loading="lazy"></figure>
      <figure><img src="portfolio 7.jpg" alt="Portfolio image 7" loading="lazy"></figure>
      <figure><img src="portfolio 8.jpg" alt="Portfolio image 8" loading="lazy"></figure>
      <figure><img src="portfolio 9.jpg" alt="Portfolio image 9" loading="lazy"></figure>
      <figure><img src="portfolio 10.jpg" alt="Portfolio image 10" loading="lazy"></figure>
      <figure><img src="portfolio 11.jpg" alt="Portfolio image 11" loading="lazy"></figure>
      <figure><img src="portfolio 12.jpg" alt="Portfolio image 12" loading="lazy"></figure>
      <figure><img src="portfolio 13.jpg" alt="Portfolio image 13" loading="lazy"></figure>
      <figure><img src="portfolio 14.jpg" alt="Portfolio image 14" loading="lazy"></figure>
      <figure><img src="portfolio 15.jpg" alt="Portfolio image 15" loading="lazy"></figure>
      <figure><img src="portfolio 16.jpg" alt="Portfolio image 16" loading="lazy"></figure>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="view" id="about"> 
    <div class="about"> 
    <p> I'm a street/travel photographer currently based in NYC, previously Seattle. 
      Most of my work is on 35mm film, occasionally digital as of late. 
    </p> 
      <h2>Contact</h2> 
      <ul> <li><a href="mailto:jonathanliu517@gmail.com">Email</a>
      </li> <li><a href="https://instagram.com/jliu517">Instagram</a></li> </ul> 
    </div> 
  </section>

</main>

<footer>
  <span>&copy; 2026 Jon Liu</span>
  <span class="footer-signoff">SEE YOU SPACE COWBOY...</span>
</footer>

<script>
  const buttons = document.querySelectorAll('.tab-btn');
  const views = document.querySelectorAll('.view');
  const indicator = document.getElementById('tab-indicator');

  function moveIndicator(btn) {
    indicator.style.left = btn.offsetLeft + 'px';
    indicator.style.width = btn.offsetWidth + 'px';
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      views.forEach(v => v.classList.remove('active'));

      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
      moveIndicator(btn);
    });
  });

  // Initialize indicator position on load
  window.addEventListener('load', () => moveIndicator(document.querySelector('.tab-btn.active')));
  window.addEventListener('resize', () => moveIndicator(document.querySelector('.tab-btn.active')));

  // ---------- Row-based masonry (CSS Grid + computed row-span) ----------

  const grid = document.querySelector('.gallery');
  const figures = document.querySelectorAll('.gallery figure');

  function resizeGridItem(figure) {
    const img = figure.querySelector('img');
    const rowHeight = parseFloat(window.getComputedStyle(grid).getPropertyValue('grid-auto-rows')) || 1;
    const desiredGap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 24;
    const itemHeight = img.getBoundingClientRect().height;
    const rowSpan = Math.ceil((itemHeight + desiredGap) / rowHeight);
    figure.style.gridRowEnd = 'span ' + rowSpan;
  }

  function resizeAllGridItems() {
    figures.forEach(resizeGridItem);
  }

  let resizeTimer;
  function debouncedResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeAllGridItems, 150);
  }

  figures.forEach(figure => {
    const img = figure.querySelector('img');
    if (img.complete) {
      resizeGridItem(figure);
    } else {
      img.addEventListener('load', () => resizeGridItem(figure));
    }
  });

  window.addEventListener('load', resizeAllGridItems);
  window.addEventListener('resize', debouncedResize);
</script>

</body>
</html>
